name: Python CI and Lab3 Run

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:
    inputs:
      student_name:
        description: "Ім'я виконавця (для перевірки умови if)"
        required: true
        default: "Executer"
  schedule:
    # Щопонеділка о 10:30 UTC (виконання один раз на тиждень)
    - cron: '30 10 * * 1'

jobs:
  test_and_run:
    name: Run Lab3 Code and Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest coverage pytest-cov

      - name: Run Python script from lab3
        run: |
          python ./lab3/app.py

      - name: Run pytest with coverage in lab3
        run: |
          cd lab3
          pytest --cov=app --cov-branch --cov-report=term-missing -v

      - name: Send custom greeting (if condition)
        if: github.event.inputs.student_name != 'Executer' && github.event_name == 'workflow_dispatch'
        run: |
          echo "Привіт, ${{ github.event.inputs.student_name }}! Умова if спрацювала успішно."
